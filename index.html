<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>CORA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%231b3a8c%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2226%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%2214%22/%3E%3Ccircle cx=%2250%22 cy=%2224%22 r=%229%22 fill=%22%23f4b400%22/%3E%3C/svg%3E">
<style>
/* Layout: software clínico — menu lateral branco (logo, instituição, navegação por seções), barra superior (seção, busca rápida de pacientes, relógio de Brasília, usuário) e área de trabalho clara. Login em tela dividida. No celular: cabeçalho compacto e navegação inferior. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f7; --line:#e2e7ef; --line-2:#d3dae5;
  --fg:#101828; --muted:#5b6880; --subtle:#8a95a8;
  --accent:#1f52b8; --accent-2:#2a63d6; --accent-ink:#ffffff; --accent-soft:#e9f0fd; --accent-line:#c9d8f6;
  --brand:#16337a; --yellow:#f4b400; --yellow-ink:#3b2a00; --yellow-soft:#fff6d9; --red:#c62f3b; --red-soft:#fdecee;
  --s-rec:#9a5800; --s-rec-soft:#fdf3e1; --s-cli:#1f52b8; --s-cli-soft:#e9f0fd; --s-pro:#6941c6; --s-pro-soft:#f2edfc;
  --s-prov:#b54708; --s-prov-soft:#fef0e6; --s-alta:#067647; --s-alta-soft:#e4f5ec; --bad:#c62f3b; --bad-soft:#fdecee;
  --bar:#1f52b8; --grid:#e9edf3;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);
  --shadow-lg:0 20px 48px rgba(16,24,40,.18);
  --f-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c111b; --surface:#131a26; --surface-2:#172031; --surface-3:#1d283a; --line:#253148; --line-2:#2f3d57;
  --fg:#e7ecf4; --muted:#9aa5ba; --subtle:#76819a;
  --accent:#7fa3f5; --accent-2:#9db9f8; --accent-ink:#0b1430; --accent-soft:#1a2747; --accent-line:#2c4170;
  --brand:#a9c0f7; --yellow:#f7c948; --yellow-ink:#2b1f00; --yellow-soft:#382d0d; --red:#f27a83; --red-soft:#3d1b1f;
  --s-rec:#f5c25c; --s-rec-soft:#382a10; --s-cli:#7fa3f5; --s-cli-soft:#1a2747; --s-pro:#bba2f5; --s-pro-soft:#2a2046;
  --s-prov:#f4a06c; --s-prov-soft:#3b2416; --s-alta:#5fd39a; --s-alta-soft:#13332a; --bad:#f27a83; --bad-soft:#3d1b1f;
  --bar:#7fa3f5; --grid:#222d40;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25); --shadow-lg:0 20px 48px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c111b; --surface:#131a26; --surface-2:#172031; --surface-3:#1d283a; --line:#253148; --line-2:#2f3d57;
  --fg:#e7ecf4; --muted:#9aa5ba; --subtle:#76819a;
  --accent:#7fa3f5; --accent-2:#9db9f8; --accent-ink:#0b1430; --accent-soft:#1a2747; --accent-line:#2c4170;
  --brand:#a9c0f7; --yellow:#f7c948; --yellow-ink:#2b1f00; --yellow-soft:#382d0d; --red:#f27a83; --red-soft:#3d1b1f;
  --s-rec:#f5c25c; --s-rec-soft:#382a10; --s-cli:#7fa3f5; --s-cli-soft:#1a2747; --s-pro:#bba2f5; --s-pro-soft:#2a2046;
  --s-prov:#f4a06c; --s-prov-soft:#3b2416; --s-alta:#5fd39a; --s-alta-soft:#13332a; --bad:#f27a83; --bad-soft:#3d1b1f;
  --bar:#7fa3f5; --grid:#222d40;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25); --shadow-lg:0 20px 48px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

/* ===== estrutura ===== */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:20px 12px 14px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.logo{display:flex;flex-direction:column;gap:4px;padding:2px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.wordmark{display:flex;align-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.04em;line-height:1;color:var(--brand)}
.wordmark svg{width:24px;height:24px;margin:0 2px;flex:none}
.wordmark.claro{color:#fff}
.logo-sub{font-size:11px;line-height:1.35;color:var(--muted)}
.inst{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);line-height:1.4;margin-top:4px}
.inst:empty{display:none}
.inst button{border:0;background:var(--surface-3);color:var(--muted);cursor:pointer;font-size:11px;padding:1px 7px;border-radius:5px;text-transform:none;letter-spacing:0;font-weight:600}
.inst button:hover{color:var(--accent)}
.inst.vazio button{background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-lbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--subtle);padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px;text-align:left;width:100%;position:relative}
.nav-i svg{width:18px;height:18px;flex:none;color:var(--subtle)}
.nav-i:hover{background:var(--surface-2);color:var(--fg)}
.nav-i[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-i[aria-current="page"] svg{color:var(--accent)}
.nav-i .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--s-rec-soft);color:var(--s-rec);border-radius:99px;padding:0 7px;min-width:20px;text-align:center;line-height:18px}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--subtle);display:flex;flex-direction:column;gap:3px}
.side-foot b{color:var(--muted);font-weight:600}
.work{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;display:flex;align-items:center;gap:14px;min-height:60px;padding-block:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:600}
.crumb .sep{color:var(--line-2)}
.busca{position:relative;flex:1;max-width:420px;margin-left:auto}
.busca input[type=search]{padding-left:36px;background:var(--surface-2)}
.busca>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--subtle);pointer-events:none}
.busca-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:40;max-height:360px;overflow-y:auto}
.busca-res button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;text-align:left;cursor:pointer}
.busca-res button:last-child{border-bottom:0}
.busca-res button:hover,.busca-res button:focus-visible{background:var(--accent-soft)}
.busca-res b{display:block;font-weight:600;font-size:13.5px}
.busca-res span{font-size:12px;color:var(--muted)}
.busca-res .vazio{padding:12px;color:var(--muted);font-size:13px}
.clock{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.clock b{color:var(--fg);font-weight:500}
.clock i{width:7px;height:7px;border-radius:50%;background:var(--s-alta);box-shadow:0 0 0 3px var(--s-alta-soft)}
.me{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 3px;background:var(--surface);cursor:pointer;min-width:0;max-width:260px}
.me:hover{border-color:var(--line-2);background:var(--surface-2)}
.me:empty{display:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;font-family:var(--f-display);border:0}
.me-txt{min-width:0;text-align:left}
.me-txt b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.me-txt span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.gut{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.in{max-width:1360px;margin:0 auto;width:100%}
main{padding-block:24px 64px}
.stack{display:flex;flex-direction:column;gap:18px}
.bottomnav{display:none}
.side .m-me{display:none}

/* ===== tipografia ===== */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:2px}
.head h1{font-family:var(--f-display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.015em;line-height:1.2}
.head p{margin:4px 0 0;color:var(--muted);max-width:72ch;font-size:13.5px}
.h3{font-family:var(--f-display);font-size:14px;font-weight:700;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mono{font-family:var(--f-mono);font-size:12.5px}

/* ===== controles ===== */
.btn{border:1px solid var(--line-2);background:var(--surface);min-height:36px;padding:6px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;color:var(--fg);box-shadow:var(--shadow-sm);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--subtle)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{min-height:30px;padding:3px 11px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.go-cli{background:var(--s-cli);border-color:var(--s-cli);color:var(--surface)}
.btn.go-pro{background:var(--s-pro);border-color:var(--s-pro);color:var(--surface)}
.btn.go-prov{background:var(--surface);color:var(--s-prov);border-color:color-mix(in srgb,var(--s-prov) 45%,transparent)}
.btn.go-alta{background:var(--s-alta);border-color:var(--s-alta);color:var(--surface)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);font-size:12.5px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.12)}
input[type=text],input[type=search],input[type=date],input[type=tel],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 11px;width:100%;min-width:0;min-height:38px;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[readonly]{background:var(--surface-2);color:var(--muted)}
textarea{resize:vertical;min-height:88px}

/* ===== avisos ===== */
.banner{border-radius:10px;padding:11px 14px;background:var(--accent-soft);color:var(--fg);font-size:13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--accent-line)}
.banner.warn{background:var(--yellow-soft);border-color:color-mix(in srgb,var(--yellow) 45%,transparent)}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.empty{color:var(--muted);padding:24px 8px;text-align:center;font-size:13.5px}

/* ===== painéis ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow-sm)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0}
.panel-b{padding:14px 18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;line-height:18px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.e-recepcao{background:var(--s-rec-soft);color:var(--s-rec)} .e-clinica{background:var(--s-cli-soft);color:var(--s-cli)}
.e-procedimento{background:var(--s-pro-soft);color:var(--s-pro)} .e-provisoria{background:var(--s-prov-soft);color:var(--s-prov)}
.e-alta{background:var(--s-alta-soft);color:var(--s-alta)}
.c-recepcao{--sc:var(--s-rec);--sc-soft:var(--s-rec-soft)} .c-clinica{--sc:var(--s-cli);--sc-soft:var(--s-cli-soft)} .c-procedimento{--sc:var(--s-pro);--sc-soft:var(--s-pro-soft)} .c-provisoria{--sc:var(--s-prov);--sc-soft:var(--s-prov-soft)} .c-alta{--sc:var(--s-alta);--sc-soft:var(--s-alta-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--s-pro-soft);color:var(--s-pro);font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px}
.desc{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}

/* ===== quadro de check-in ===== */
.daystrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;min-width:0}
.dstat .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--sc-soft,var(--accent-soft));color:var(--sc,var(--accent));flex:none}
.dstat .ic svg{width:19px;height:19px}
.dstat span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.dstat b{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface-3);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 4px;gap:6px}
.col-h b{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--fg)}
.col-h b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc)}
.col-h span{font-size:12px;font-weight:600;background:var(--surface);border-radius:99px;padding:0 9px;color:var(--muted);line-height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:7px;min-width:0;box-shadow:var(--shadow-sm);transition:box-shadow .12s,border-color .12s}
.card:hover{box-shadow:var(--shadow);border-color:var(--line-2)}
.card.mine{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.track{display:flex;gap:3px}
.track i{flex:1;height:3px;border-radius:99px;background:var(--surface-3)}
.track i.on{background:var(--accent)}
.track.fim i.on{background:var(--s-alta)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-top b{font-weight:600;font-size:14px;cursor:pointer;overflow-wrap:anywhere;line-height:1.35}
.card-top b:hover{color:var(--accent)}
.card .sub{color:var(--muted);font-size:12.5px;line-height:1.4}
.steps{display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--f-mono);font-size:11.5px;color:var(--subtle)}
.steps i{font-style:normal;color:var(--fg)}
.wait{font-family:var(--f-mono);font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:6px;background:var(--s-rec-soft);color:var(--s-rec);white-space:nowrap;line-height:20px}
.wait.long{background:var(--bad-soft);color:var(--bad)}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px;border-top:1px solid var(--line);margin-top:2px}
.card .acts .btn{flex:1 1 auto;margin-top:6px}
.old{font-size:11px;font-weight:700;color:var(--bad)}

/* ===== listas e tabelas ===== */
.split{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr);gap:18px;align-items:start}
.list{max-height:640px;overflow:auto}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li[aria-selected="true"]{background:var(--accent-soft)}
.li b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.li .l{min-width:0}
.li span.s{color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.02em;color:var(--muted);font-weight:600;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:top}
td b{font-weight:600}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

<script>
(() => {
"use strict";
/* ===== utilidades ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TZ = "America/Sao_Paulo";
const fKey = new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"});
const fHora = new Intl.DateTimeFormat("pt-BR", {timeZone:TZ, hour:"2-digit", minute:"2-digit"});
const fHoraNum = new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"2-digit", hourCycle:"h23"});
const fDataHora = new Intl.DateTimeFormat("pt-BR", {timeZone:TZ, day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"});
const fRelogio = new Intl.DateTimeFormat("pt-BR", {timeZone:TZ, weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
const keyBR = (d = new Date()) => fKey.format(d);              // AAAA-MM-DD no horário de Brasília
const horaBR = (iso) => iso ? fHora.format(new Date(iso)) : "—";
const dataHoraBR = (iso) => iso ? fDataHora.format(new Date(iso)) : "—";
const kParse = (k) => { const [y,m,d] = k.split("-").map(Number); return new Date(Date.UTC(y, m-1, d, 12)); };
const kFmt = (d) => d.toISOString().slice(0,10);
const kAdd = (k, n) => { const d = kParse(k); d.setUTCDate(d.getUTCDate()+n); return kFmt(d); };
const kDate = (k, o) => kParse(k).toLocaleDateString("pt-BR", {timeZone:"UTC", ...o});
const kShort = (k) => k ? kDate(k, {day:"2-digit", month:"2-digit", year:"numeric"}) : "—";
const mins = (a, b) => (new Date(b) - new Date(a)) / 60000;
const durTxt = (m) => { if (m == null || isNaN(m)) return "—"; m = Math.max(0, Math.round(m)); if (m < 60) return m + " min"; return Math.floor(m/60) + " h " + String(m%60).padStart(2,"0") + " min"; };
const digits = (s) => String(s||"").replace(/\D/g, "");
const maskCPF = (s) => { const d = digits(s).slice(0,11); return d.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2"); };
const maskTel = (s) => { const d = digits(s).slice(0,11); return d.length <= 10 ? d.replace(/(\d{2})(\d)/,"($1) $2").replace(/(\d{4})(\d)/,"$1-$2") : d.replace(/(\d{2})(\d)/,"($1) $2").replace(/(\d{5})(\d)/,"$1-$2"); };
const cpfOk = (s) => { const d = digits(s); if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false; const c = (n) => { let t = 0; for (let i=0;i<n;i++) t += +d[i]*(n+1-i); const r = (t*10)%11; return r===10?0:r; }; return c(9)===+d[9] && c(10)===+d[10]; };
const idade = (n) => { if (!n) return null; const [y,m,d] = n.split("-").map(Number); const [ty,tm,td] = keyBR().split("-").map(Number); let a = ty-y; if (tm<m || (tm===m && td<d)) a--; return a; };
const norm = (s) => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const matKey = (s) => String(s||"").trim().toUpperCase().replace(/[^A-Z0-9_.\-]/g, "");

const ETAPAS = {
  recepcao:     {nome:"Check-in na recepção", curto:"Recepção"},
  clinica:      {nome:"Entrada na clínica", curto:"Em clínica"},
  procedimento: {nome:"Procedimento finalizado", curto:"Procedimento"},
  provisoria:   {nome:"Liberação provisória", curto:"Retorna"},
  alta:         {nome:"Alta (liberação final)", curto:"Alta"},
};
const FUNCOES = {admin:"Administrador(a)", professor:"Professor(a)", rt:"Responsável técnico", recepcao:"Recepção", aluno:"Aluno(a)", outro:"Outro colaborador"};
// Administrador, professor e responsável técnico têm acesso a tudo.
const ADMINS = ["admin","professor","rt"];
const PROCS_PADRAO = ["Anamnese e exame clínico","Radiografia","Profilaxia","Raspagem e alisamento radicular","Aplicação tópica de flúor","Selante","Restauração em resina composta","Restauração em ionômero de vidro","Tratamento endodôntico","Exodontia","Cirurgia periodontal","Prótese (moldagem / ajuste)","Urgência odontológica","Orientação de higiene oral"];

/* ===== estado ===== */
const S = {
  membros:[], pacientes:[], atend:[], semestres:null, procs:null,
  inst:"", view:"checkin", idSub:"alunos", progMode:"paciente", progSel:null, progBusca:"", progFiltro:"todos", logDia:"",
  progAluno:null, prodIni:"", prodFim:"", prodBusca:"",
  memBusca:"", memFiltro:"", pacBusca:"", per:"semana", ref:keyBR(),
  meMat:null, forcarTroca:false, senhas:{}, senhasOk:false, sortAl:{k:"op", dir:-1}, dl:null,
  mode:"loading", canWrite:true, canAdmin:true, isOwner:true, uid:null,
};
let B = null; // backend
const LKEY = "odonto-escola-v1";
const local = {
  load(){ try { const v = JSON.parse(localStorage.getItem(LKEY)||"null"); if (v) Object.assign(S, {membros:v.membros||[], pacientes:v.pacientes||[], atend:v.atend||[], semestres:v.semestres||null, procs:v.procs||null, inst:v.inst||"", senhas:v.senhas||{}}); } catch {} S.senhasOk = true; },
  save(){ try { localStorage.setItem(LKEY, JSON.stringify({membros:S.membros, pacientes:S.pacientes, atend:S.atend, semestres:S.semestres, procs:S.procs, inst:S.inst, senhas:S.senhas})); } catch {} },
  col(c){ return c==="atendimentos" ? "atend" : c; },
  async add(c, d){ const id = Date.now().toString(36)+Math.random().toString(36).slice(2,7); S[this.col(c)].push({id, ...d}); this.save(); render(); return id; },
  async set(c, id, d){
    if (c==="config") { if (id==="semestres") S.semestres = d.lista; else if (id==="instituicao") S.inst = d.nome || ""; else S.procs = d.lista; this.save(); render(); return; }

function render(){

  let pre = "";
  if (S.mode === "local") pre += `<div class="banner warn">Modo local: os dados ficam apenas neste navegador. Abra pelo claude.ai, conectado, para salvar na nuvem e usar em equipe.</div>`;

  if (!liberado()) { view.innerHTML = pre + vGate(); restore(aid, sel); tick(); return; }
  const m = me();
  if (isAdmin() && S.membros.length <= 1) pre += `<div class="banner"><span><b>Próximo passo:</b> cadastre a recepção, os professores e os alunos em Identificação. Cada cadastro gera uma senha provisória.</span><button class="btn sm primary" type="button" data-go="identificacao">Ir para Identificação</button></div>`;
  if (m && (ADMINS.includes(m.tipo) || m.tipo === "recepcao") && !S.canAdmin && S.mode === "db") pre += `<div class="banner warn">Sua função pede acesso de Editor a este app, que sua conta do claude.ai ainda não tem. Peça ao responsável para compartilhar com você como Editor.</div>`;
  if (vencido(m)) pre += `<div class="banner warn">Seu código temporário venceu em ${esc(kShort(m.validade))}. Procure o administrador para renovar ou cadastrar sua matrícula definitiva.</div>`;

  const fn = {checkin:vCheckin, identificacao:vIdent, progresso:vProgresso, metricas:vMetricas, producao:() => vProducao(true)}[S.view];
  view.innerHTML = pre + fn();

  else if (a.etapa === "clinica") acts = `<button class="btn sm go-pro" type="button" data-step="procedimento" data-id="${a.id}">Finalizar procedimento</button>`;

function semAtual(k = keyBR()){ return semestresLista(+k.slice(0,4)).find(s => k >= s.inicio && k <= s.fim); }

    const pc = {}; x.op.forEach(a => (a.procedimentos||[]).forEach(p => pc[p] = (pc[p]||0)+1));

    if (a.auxiliarMatricula) reg(a.auxiliarMatricula).aux++;
    if (a.circulanteMatricula) reg(a.circulanteMatricula).circ++;

  const segP = `<div class="seg" role="group" aria-label="Período">${[["dia","Dia"],["semana","Semana"],["mes","Mês"],["semestre","Semestre letivo"],["ano","Ano"]].map(([k,n])=>`<button type="button" data-per="${k}" aria-pressed="${S.per===k}">${n}</button>`).join("")}</div>`;
  const g = P.g === "hora" ? "hora de chegada" : P.g === "dia" ? "dia" : "mês";
  return `<div class="head"><div><h1>Métricas</h1><p>Painel de indicadores da clínica. Passe o mouse nos gráficos para ver os valores.</p></div>${segP}</div>
  <div class="row" style="justify-content:space-between">
    <div class="row"><button class="btn sm" type="button" data-mv="-1" aria-label="Período anterior">‹</button><button class="btn sm" type="button" data-mv="1" aria-label="Próximo período">›</button><input type="date" id="ref" value="${S.ref}" style="width:auto" aria-label="Data de referência"><b style="font-family:var(--f-display);font-size:16px">${esc(P.rot.charAt(0).toUpperCase()+P.rot.slice(1))}</b></div>

  </div>
  <div class="kpis">
    <div class="kpi hl"><span>Pacientes atendidos</span><b>${E.pac}</b>${delta(E.pac, Ea.pac)}</div>
    <div class="kpi"><span>Check-ins</span><b>${list.length}</b>${delta(list.length, Ea.list.length)}</div>
    <div class="kpi"><span>Procedimentos</span><b>${totProc}</b>${delta(totProc, Ea.comProc.reduce((n,a)=>n+(a.procedimentos?.length||0),0))}</div>
    <div class="kpi"><span>Espera média</span><b>${durTxt(E.espM)}</b>${delta(E.espM, Ea.espM, true)}</div>

async function entrar(rawMat, senha){
  const mat = matKey(rawMat);
  if (!mat || !senha) return "Digite a matrícula e a senha.";
  if (S.mode === "supa") {
    const {data, error} = await sb.auth.signInWithPassword({email:emailDe(mat), password:senha});
    if (error) return /invalid/i.test(error.message) ? "Matrícula ou senha incorreta." : "Não foi possível entrar: " + error.message;
    try { await carregarTudo(); } catch { await sb.auth.signOut(); return "Não foi possível carregar os dados. Tente de novo."; }
    const m = S.membros.find(x => x.userId === data.user.id);
    const erro = !m ? "Seu acesso não está ligado a um cadastro ativo. Procure o administrador." : m.ativo === false ? "Este cadastro está inativo. Procure o administrador." : vencido(m) ? `Este código temporário venceu em ${kShort(m.validade)}. Procure o administrador.` : "";
    if (erro) { await sb.auth.signOut(); S.membros = []; S.pacientes = []; S.atend = []; return erro; }
    S.meMat = m.matricula; S.forcarTroca = !!m.trocarSenha; ultimoUso = Date.now(); gravarSessao(); render();
    if (!S.forcarTroca) toast(`Olá, ${m.nome.split(" ")[0]}!`);
    return null;
  }
  const m = membro(mat), rec = S.senhas[mat];
  const ok = m && rec && await confere(senha, rec);
  if (!ok) return "Matrícula ou senha incorreta.";
  if (m.ativo === false) return "Este cadastro está inativo. Procure o administrador.";
  if (vencido(m)) return `Este código temporário venceu em ${kShort(m.validade)}. Procure o administrador.`;
  S.meMat = mat; S.forcarTroca = !!rec.trocar; ultimoUso = Date.now(); gravarSessao(); render();
  if (!S.forcarTroca) toast(`Olá, ${m.nome.split(" ")[0]}!`);
  return null;
}

async function converter(m, nova){
  if (S.mode === "supa") {
    const r = await sb.rpc("converter_matricula", {de:m.matricula, para:nova}); if (r.error) throw r.error;
    await funcaoAdmin({acao:"atualizar_login", matricula:nova});
    if (S.meMat === m.matricula) { S.meMat = nova; gravarSessao(); }
    await carregarTudo(); render(); return;
  }
  const d = {...strip(m), matricula:nova, temporario:false, validade:"", convertidoDe:m.matricula};
  await B.set("membros", nova, d);
  const troca = (x) => x === m.matricula ? nova : x;
  for (const a of S.atend.filter(a => equipe(a).includes(m.matricula) || (a.eventos||[]).some(e=>e.por===m.matricula))) {
    await B.patch("atendimentos", a.id, {alunoMatricula:troca(a.alunoMatricula||""), auxiliarMatricula:troca(a.auxiliarMatricula||""), circulanteMatricula:troca(a.circulanteMatricula||""), eventos:(a.eventos||[]).map(e=>({...e, por:troca(e.por)}))});
  }
  const sen = S.senhas[m.matricula];
  if (sen) { await B.set("senhas", nova, sen); await B.del("senhas", m.matricula); }
  if (S.meMat === m.matricula) { S.meMat = nova; gravarSessao(); }
  await B.del("membros", m.matricula);
}

document.addEventListener("click", async (e) => {

    if (e2) { el.textContent = e2; return; }
    t.disabled = true;
    const atual = membro(mat);
    const d = {...(atual ? strip(atual) : {}), matricula:mat, nome, tipo: atual && ADMINS.includes(atual.tipo) ? atual.tipo : "admin", ativo:true, criadoEm: atual?.criadoEm || new Date().toISOString()};

  }
  else if (act === "sair") sair("Você saiu do CORA.");
  else if (act === "trocar-senha") dlgTrocarSenha();
  else if (act === "conta") dlgConta();
  else if (act === "csv") baixarCSV(t.dataset.tabela);
  else if (act === "checkin") dlgCheckin();
  else if (act === "novo-pac") { if (isRecep()) dlgPaciente(null, S.view==="checkin" ? (id)=>dlgCheckin(id) : null); }
  else if (act === "novo-aluno") dlgMembro(null, "aluno");
  else if (act === "novo-colab") dlgMembro(null, "colab");
  else if (act === "novo-temp") dlgTemp();
  else if (act === "semestres") dlgSemestres();
  else if (act === "config") dlgProcs();
  else if (act === "inst") dlgInst();
});
view.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (["gate-mat","gate-pw","nv-2","cf-2"].includes(e.target.id)) { e.preventDefault(); $("[data-act=gate],[data-act=nova-senha],[data-act=setup]")?.click(); }
  else if (e.target.dataset?.psel) { S.progSel = e.target.dataset.psel; render(); }
  else if (e.target.dataset?.asel) { S.progAluno = e.target.dataset.asel; render(); }
  else if (e.target.dataset?.ver) { const x = S.atend.find(y=>y.id===e.target.dataset.ver); if (x) dlgDetalhe(x); }
});
view.addEventListener("click", (e) => {
  const t = e.target.closest("[data-sort],[data-step],[data-ver],[data-idsub],[data-edit-m],[data-edit-p],[data-prog],[data-psel],[data-asel],[data-pf],[data-openpac],[data-logclear],[data-per],[data-mv],[data-prod],[data-prodaluno]"); if (!t) return;
  const d = t.dataset, a = d.id ? S.atend.find(x=>x.id===d.id) : null;
  if (d.sort) { S.sortAl = {k:d.sort, dir: S.sortAl.k === d.sort ? -S.sortAl.dir : -1}; render(); return; }
  if (d.step && a) { if (!podeAgir(a)) return toast("Você não tem permissão para esta etapa."); if (d.step==="clinica") dlgEntrada(a); else if (d.step==="procedimento") dlgProcedimento(a); else dlgLiberar(a, d.step); }
  else if (d.ver) { const x = S.atend.find(y=>y.id===d.ver); if (x) dlgDetalhe(x); }
  else if (d.idsub && isAdmin()) { if (S.idSub !== d.idsub) { S.memFiltro = ""; S.memBusca = ""; } S.idSub = d.idsub; render(); }
  else if (d.editM) dlgMembro(membro(d.editM));
  else if (d.editP) dlgPaciente(paciente(d.editP));
  else if (d.prog) { S.progMode = d.prog; render(); }
  else if (d.psel) { S.progSel = d.psel; render(); }
  else if (d.asel) { S.progAluno = d.asel; render(); }
  else if (d.pf) { S.progFiltro = d.pf; render(); }
  else if (d.openpac) { S.progMode = "paciente"; S.progSel = d.openpac; render(); window.scrollTo(0,0); }
  else if ("logclear" in d) { S.logDia = ""; render(); }
  else if (d.per) { S.per = d.per; render(); }
  else if (d.mv) mover(+d.mv);
  else if (d.prod != null) { [S.prodIni, S.prodFim] = d.prod.split("|"); render(); }
  else if (d.prodaluno) { const P = periodo(); S.view = "progresso"; S.progMode = "aluno"; S.progAluno = d.prodaluno; S.prodIni = P.ini; S.prodFim = P.fim; render(); window.scrollTo(0,0); }
});
view.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "mem-busca") { S.memBusca = e.target.value; render(); }
  if (id === "pac-busca") { S.pacBusca = e.target.value; render(); }
  if (id === "prog-busca") { S.progBusca = e.target.value; render(); }
  if (id === "prod-busca") { S.prodBusca = e.target.value; render(); }
});
view.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "mem-filtro") { S.memFiltro = e.target.value; render(); }
  if (id === "log-dia") { S.logDia = e.target.value; render(); }
  if (id === "ref" && e.target.value) { S.ref = e.target.value; render(); }
  if (id === "prod-ini") { S.prodIni = e.target.value; render(); }
  if (id === "prod-fim") { S.prodFim = e.target.value; render(); }
});
const tip = $("#tip");
view.addEventListener("pointerover", (e) => { const t = e.target.closest("[data-tip]"); if (!t) return; tip.textContent = t.dataset.tip; tip.hidden = false; });
view.addEventListener("pointermove", (e) => { if (tip.hidden) return; const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (e.clientY - 34) + "px"; });
view.addEventListener("pointerout", (e) => { if (e.target.closest("[data-tip]")) tip.hidden = true; });
$("#busca-global").addEventListener("input", (e) => buscaGlobal(e.target.value));
$("#busca-global").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.target.value = ""; buscaGlobal(""); } else if (e.key === "Enter") $("#busca-res [data-busca-pac]")?.click(); });
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-busca-pac]");
  if (b) {
    const id = b.dataset.buscaPac; $("#busca-global").value = ""; buscaGlobal("");
    if (isAdmin()) { S.view = "progresso"; S.progMode = "paciente"; S.progSel = id; render(); window.scrollTo(0,0); }
    else dlgPaciente(paciente(id));
    return;
  }
  if (!e.target.closest("#busca-wrap")) $("#busca-res").hidden = true;
});
let tT; function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(()=>t.hidden = true, 3400); }

/* ===== inicialização ===== */
try { const v0 = localStorage.getItem(LKEY+"-view"); if (v0) S.view = v0; } catch {}
try { localStorage.removeItem(LKEY+"-me"); } catch {}
render();
setInterval(tick, 20000);

(async function boot(){
  if (sb) {
    B = supa(); S.senhasOk = true; S.canAdmin = true; S.canWrite = true; S.isOwner = false;
    sb.from("config").select("valor").eq("chave","instituicao").maybeSingle().then(({data}) => { if (data?.valor?.nome) { S.inst = data.valor.nome; render(); } });
    try {
      const {data:{session}} = await sb.auth.getSession();
      if (session) {
        const ultimo = +(localStorage.getItem("cora-ultimo") || 0);
        if (Date.now() - ultimo > INATIVO_MIN*60000) await sb.auth.signOut();
        else {
          await carregarTudo();
          const m = S.membros.find(x => x.userId === session.user.id);
          if (m && m.ativo !== false && !vencido(m)) { S.meMat = m.matricula; S.forcarTroca = !!m.trocarSenha; ultimoUso = Date.now(); gravarSessao(); }
          else await sb.auth.signOut();
        }
      }
    } catch { toast("Não foi possível conectar ao servidor. Verifique a internet."); }
    S.mode = "supa"; assinarTempoReal(); render(); return;
  }
  const use = window.claude?.use;
  const db = use ? await use("db").catch(()=>null) : null;
  const ses = lerSessao();
  if (!db) { S.mode = "local"; B = local; local.load(); if (ses && membro(ses.mat) && S.senhas[ses.mat]) { S.meMat = ses.mat; S.forcarTroca = !!ses.troca; } render(); return; }
  B = remote(db);
  const user = await use("user").catch(()=>null);
  if (user) {
    try { S.isOwner = !!(await user.isOwner()); } catch { S.isOwner = false; }
    try { S.canAdmin = !!(await user.canEdit()); } catch { S.canAdmin = false; }
    try { const c = await user.can("data.write"); if (c === false) S.canWrite = false; } catch {}
    try { S.uid = await user.id(); } catch {}
  } else { S.isOwner = false; S.canAdmin = false; }
  if (ses) { S.meMat = ses.mat; S.forcarTroca = !!ses.troca; }
  use("downloads").then(d => { S.dl = d; }).catch(()=>{});
  render();
  db.collection("senhas").onSnapshot((snap) => {
    const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.senhas = m;
    if (!snap.metadata.fromCache) S.senhasOk = true;
    if (S.meMat && !S.senhas[S.meMat] && S.senhasOk) { S.meMat = null; gravarSessao(); }
    render();
  }, () => { S.senhasOk = true; render(); });
  const cols = {membros:"membros", pacientes:"pacientes", atendimentos:"atend"};
  const got = {membros:false, pacientes:false, atendimentos:false};
  const timer = setTimeout(() => { if (S.mode !== "db") { S.mode = "slow"; render(); } }, 10000);
  const done = () => { if (Object.values(got).every(Boolean)) { clearTimeout(timer); S.mode = "db"; } };
  const fail = (e) => { clearTimeout(timer); S.mode = "db"; if (e?.code === "revoked") S.canWrite = false; render(); toast("A conexão com os dados foi interrompida. Recarregue a página."); };
  for (const [c, k] of Object.entries(cols)) {
    db.collection(c).onSnapshot((snap) => {
      S[k] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if (!snap.metadata.fromCache) got[c] = true;
      done(); render();
    }, fail);
  }
  db.doc("config/instituicao").onSnapshot((s) => { S.inst = s.exists ? (s.data().nome || "") : ""; render(); }, ()=>{});
  db.doc("config/semestres").onSnapshot((s) => { S.semestres = s.exists ? (s.data().lista || null) : null; render(); }, ()=>{});
  db.doc("config/procedimentos").onSnapshot((s) => { S.procs = s.exists ? (s.data().lista || null) : null; render(); }, ()=>{});
})();
})();
</script>
